spring:
  application:
    name: estoque-madeireira
  datasource:
    url: jdbc:mysql://localhost:3306/estoque_madeireira?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html

viacep:
  url: https://viacep.com.br

app:
  jwt:
    # Chave que assina o token (HS256). Minimo de 32 caracteres.
    # Em producao SEMPRE defina a variavel de ambiente JWT_SECRET.
    secret: ${JWT_SECRET:dev-troque-este-segredo-com-pelo-menos-32-caracteres}
    # Tempo de validade do token, em minutos
    expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:120}
